name: Check PrusaSlicer Profiles

on:
  push:
  pull_request:

jobs:
  check-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate filament, printer, and physical_printer profiles
        run: python3 tools/check_profiles.py
