# FREILab-Profil fuer Drucker 1 (MK3.5, 0.6mm), handgeschrieben 2026-11-07.
# Enthaelt bewusst nur die FREILab-Abweichungen -- alles andere kommt ueber
# 'inherits' aus dem Prusa-Systemprofil. Die XL-0.6mm-Profile sind KEINE
# brauchbare Vorlage: deren start_filament_gcode setzt M572/M142 fuer den
# Nextruder der XL, was auf der MK3.5 nichts zu suchen hat.
bed_temperature = 60
compatible_printers_condition = nozzle_diameter[0]==0.6 and printer_model=="MK3.5"
filament_max_volumetric_speed = 15
filament_notes = "UNGETESTET, Startwert: max_volumetric_speed = 15 kommt unveraendert aus dem Prusa-Systemprofil 'Generic PLA @MK3.5' (fuer die MK3.5 gibt es keine 0.6mm- und keine HF-Variante, daher der Allround-Wert). Vor 2026-11-07 war auf Drucker 1 ueberhaupt kein 0.6mm-Profil auswaehlbar -- es griff FREILab PLA (MK3) mit 7 mm3/s und 210 C, also die auf MK3S/0.4mm vermessenen Werte. Temperatur 220/230 C ist der Wert des Systemprofils und deckt sich mit den uebrigen FREILab-PLA-Profilen. Zu testen mit tools/flow_test_Drucker1_PLA_0.6mm.gcode. Siehe Druckgeschwindigkeit-Optimierung.md"
filament_type = PLA
filament_vendor = Das Filament
first_layer_bed_temperature = 60
first_layer_temperature = 230
inherits = Generic PLA @MK3.5
temperature = 220
