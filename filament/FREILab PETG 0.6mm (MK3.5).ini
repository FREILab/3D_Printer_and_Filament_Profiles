# FREILab-Profil fuer Drucker 1 (MK3.5, 0.6mm), handgeschrieben 2026-11-07.
# Enthaelt bewusst nur die FREILab-Abweichungen -- alles andere kommt ueber
# 'inherits' aus dem Prusa-Systemprofil. Die XL-0.6mm-Profile sind KEINE
# brauchbare Vorlage: deren start_filament_gcode setzt M572/M142 fuer den
# Nextruder der XL, was auf der MK3.5 nichts zu suchen hat.
bed_temperature = 80
compatible_printers_condition = nozzle_diameter[0]==0.6 and printer_model=="MK3.5"
filament_max_volumetric_speed = 14
filament_notes = "UNGETESTET, Startwert: max_volumetric_speed = 14 kommt unveraendert aus dem Prusa-Systemprofil 'Generic PETG @MK3.5 0.6'. Vor 2026-11-07 war auf Drucker 1 ueberhaupt kein 0.6mm-Profil auswaehlbar -- es griff FREILab PETG (MK3) mit 10 mm3/s, also der auf MK3S/0.4mm vermessene Wert. Bett auf 80 C statt der Systemvorgabe 90/85 C, wie in allen FREILab-PETG-Profilen. Zu testen mit tools/flow_test_Drucker1_PETG_0.6mm.gcode. Siehe Druckgeschwindigkeit-Optimierung.md"
filament_type = PETG
filament_vendor = Das Filament
first_layer_bed_temperature = 80
first_layer_temperature = 240
inherits = Generic PETG @MK3.5 0.6
temperature = 240
